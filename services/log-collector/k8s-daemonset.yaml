apiVersion: apps/v1
kind: Deployment
metadata:
  name: sentrix-go-log-collector
  namespace: sentrix-system
  labels:
    app.kubernetes.io/name: log-collector
    app.kubernetes.io/part-of: sentrix-sre-platform
spec:
  replicas: 3
  selector:
    matchLabels:
      app: log-collector
  template:
    metadata:
      labels:
        app: log-collector
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        fsGroup: 65532
      containers:
        - name: log-collector
          image: ghcr.io/sre-sentrix/log-collector:v2.5
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8085
              name: http-rest
            - containerPort: 50051
              name: grpc
          env:
            - name: PORT
              value: "8085"
            - name: GRPC_PORT
              value: "50051"
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: github-ci-credentials
                  key: token
                  optional: true
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 500m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8085
            initialDelaySeconds: 3
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8085
            initialDelaySeconds: 2
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: sentrix-log-collector-svc
  namespace: sentrix-system
spec:
  selector:
    app: log-collector
  ports:
    - name: http
      protocol: TCP
      port: 8085
      targetPort: 8085
    - name: grpc
      protocol: TCP
      port: 50051
      targetPort: 50051
---
# Example: Inject as a Sidecar directly inside application Pods
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sentrix-app-with-sidecar
  namespace: sentrix-system
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend-service
  template:
    metadata:
      labels:
        app: backend-service
    spec:
      containers:
        - name: main-app
          image: node:20-alpine
          ports:
            - containerPort: 3000
          env:
            - name: LOG_COLLECTOR_SERVICE_URL
              value: "http://127.0.0.1:8085"
            - name: LOG_COLLECTOR_GRPC_ADDR
              value: "127.0.0.1:50051"
        - name: log-collector-sidecar
          image: ghcr.io/sre-sentrix/log-collector:v2.5
          ports:
            - containerPort: 8085
            - containerPort: 50051
          resources:
            requests:
              cpu: 25m
              memory: 16Mi
            limits:
              cpu: 200m
              memory: 64Mi

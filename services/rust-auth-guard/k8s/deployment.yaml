apiVersion: apps/v1
kind: Deployment
metadata:
  name: rust-auth-guard
  namespace: production
  labels:
    app: rust-auth-guard
    language: rust
    tier: edge-auth
spec:
  replicas: 4
  selector:
    matchLabels:
      app: rust-auth-guard
  template:
    metadata:
      labels:
        app: rust-auth-guard
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        linkerd.io/inject: "enabled"
    spec:
      containers:
      - name: auth-guard
        image: ghcr.io/cloudops/rust-auth-guard:v2.4.1
        ports:
        - containerPort: 8080
          name: http
        resources:
          requests:
            cpu: "100m"
            memory: "32Mi"
          limits:
            cpu: "500m"
            memory: "128Mi"
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 2
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: rust-auth-guard
  namespace: production
spec:
  selector:
    app: rust-auth-guard
  ports:
  - port: 8080
    targetPort: 8080
    name: http
